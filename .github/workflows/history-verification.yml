# The CLAUDE.md quality gate (`cargo xtask ci`: fmt, clippy -D warnings, tests, layers, assets,
# wasm) on every pull request and every push to main. Today only path-filtered workflows run on
# pull requests, so most PRs land with no test run at all.
#
# Ported from wordcraft#800. Linux only; standard GitHub-hosted runner, no secrets.
name: History verification (testing fork only)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Same craft-fonts commit as release.yml, so the font tests see what a release build embeds.
  CRAFT_FONTS_REF: abb83316d96aa59c1cf64784289e378fe9fa5695

jobs:
  gate:
    name: cargo xtask ci
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: "0"
      RUST_BACKTRACE: "1"
      # `xtask ci` builds clippy and the tests with --release. The release profile (thin LTO, one
      # codegen unit) is for shipped binaries: on a 4-core runner it makes linking the ~220 test
      # binaries take over an hour. CI keeps the optimisation level but builds in parallel units.
      CARGO_PROFILE_RELEASE_LTO: "false"
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Apply exact locally tested history patch
        run: |
          echo '' | base64 --decode > /tmp/history.patch
          echo '85b98d079401f1165cd5046de803345f0e59aa23d3d97f0e0b3ef5fa6dbed9f7  /tmp/history.patch' | sha256sum --check
          git apply --check /tmp/history.patch
          git apply /tmp/history.patch

      - name: Apply separately approved baseline hardware-test isolation patch
        run: |
          echo  | base64 --decode > /tmp/hardware-setting-isolation.patch
          echo '0cb9085d2c5c256a0c2ac3ff9c32783f40790ab5d8764fc310ad0a8dbf5cc0a1  /tmp/hardware-setting-isolation.patch' | sha256sum --check
          git apply --check /tmp/hardware-setting-isolation.patch
          git apply /tmp/hardware-setting-isolation.patch

      - name: Check out craft-fonts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: storytold/craft-fonts
          ref: ${{ env.CRAFT_FONTS_REF }}
          path: craft-fonts
          persist-credentials: false

      # libasound2-dev is for cpal (audio playback).
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libxkbcommon-dev libwayland-dev libx11-dev libxcb1-dev libxcursor-dev \
            libxrandr-dev libxi-dev libfontconfig1-dev libfreetype-dev mesa-vulkan-drivers \
            libasound2-dev ffmpeg

      # Ubuntu 24.04 ships SVT-AV1 1.7, which cannot encode the unchanged 64x48 AV1 seeds.
      # Pin a verified test oracle with SVT-AV1 >=3 rather than changing or skipping fixtures.
      - name: Install pinned FFmpeg test oracle
        run: |
          curl --fail --location --retry 3 \
            https://github.com/BtbN/FFmpeg-Builds/releases/download/autobuild-2026-10-22-13-06/ffmpeg-n8.1.3-23-g5c4f5744cd-linux64-gpl-8.1.tar.xz \
            --output /tmp/ffmpeg.tar.xz
          echo '1aa0c5526768bf4db3e62cba954169e3e0be38327c9cbbb6c5675794df6c03df  /tmp/ffmpeg.tar.xz' | sha256sum --check
          mkdir -p /tmp/filmcraft-oracle
          tar -xJf /tmp/ffmpeg.tar.xz --strip-components=1 -C /tmp/filmcraft-oracle
          echo "FILMCRAFT_FFMPEG=/tmp/filmcraft-oracle/bin/ffmpeg" >> "$GITHUB_ENV"
          echo "FILMCRAFT_FFPROBE=/tmp/filmcraft-oracle/bin/ffprobe" >> "$GITHUB_ENV"
          echo '/tmp/filmcraft-oracle/bin' >> "$GITHUB_PATH"
          /tmp/filmcraft-oracle/bin/ffmpeg -version
          /tmp/filmcraft-oracle/bin/ffprobe -version

      - name: Install Rust (stable + clippy, rustfmt, wasm32)
        run: |
          rustup toolchain install stable --profile minimal --component clippy,rustfmt \
            --target wasm32-unknown-unknown
          rustup default stable

      - name: Quality gate
        env:
          CRAFT_FONTS_DIR: ${{ github.workspace }}/craft-fonts
        run: cargo xtask ci
